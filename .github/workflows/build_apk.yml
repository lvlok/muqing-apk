name: Build 沐晴 APK (Docker Stable)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Build APK with Buildozer Docker
        run: |
          # 使用官方维护的 Buildozer Docker 镜像，避免环境配置问题
          docker run --rm -v "$(pwd):/app" \
            -w /app \
            -u root \
            artiomtr/buildozer-android:latest \
            bash -c "yes | buildozer -v android debug"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: muqing-apk
          path: bin/*.apk
