name: Build 沐晴 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.10
        run: |
          sudo apt update
          sudo apt install -y python3.10 python3.10-venv python3-pip
          python3.10 --version

      - name: Clean old Buildozer cache
        run: |
          sudo rm -rf .buildozer
          sudo rm -rf ~/.buildozer

      - name: Create default icon if missing
        run: |
          if [ ! -f "ai_chat_icon.png" ]; then
            sudo apt install -y imagemagick
            convert -size 512x512 xc:#ff99cc -font DejaVu-Sans-Bold -pointsize 200 -fill white -gravity center -annotate 0 "MQ" ai_chat_icon.png
          fi
        continue-on-error: true

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 libffi-dev libssl-dev \
            libsqlite3-dev libjpeg-dev libltdl-dev libnss3-dev wget unzip

      - name: Install Cython and Buildozer
        run: |
          python3.10 -m pip install --upgrade pip
          python3.10 -m pip install cython==0.29.33 buildozer==1.5.0

      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
          unzip -q cmdline.zip -d ~/.buildozer/android/platform/android-sdk/cmdline-tools
          mv ~/.buildozer/android/platform/android-sdk/cmdline-tools/cmdline-tools ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        continue-on-error: true

      - name: Build APK
        run: |
          if [ ! -f "main.py" ]; then
            echo "Error: main.py not found!"
            exit 1
          fi
          # 锁定 build-tools 版本
          sed -i 's/# android.build_tools = .*/android.build_tools = 30.0.3/' buildozer.spec
          python3.10 -m buildozer -v android debug --accept-licenses

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: muqing-apk
          path: bin/*.apk
