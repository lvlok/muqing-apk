name: Build 沐晴 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2  # 指定版本修复 Node.js 警告

      - name: Set up Python
        uses: actions/setup-python@v5.6.0 # 指定版本修复 Node.js 警告
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo5 \
            libffi-dev libssl-dev \
            libsqlite3-dev

      - name: Install Cython and Buildozer
        run: |
          pip install --upgrade pip
          pip install cython==0.29.33 buildozer

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muqing-apk
          path: bin/*.apk
