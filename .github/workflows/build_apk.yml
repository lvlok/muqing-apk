name: Build 沐晴 APK (Final Fix)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.10
        run: |
          sudo apt update
          sudo apt install -y python3.10 python3.10-venv python3-pip
          python3.10 --version

      - name: Create default icon (if missing)
        run: |
          if [ ! -f "ai_chat_icon.png" ]; then
            sudo apt install -y imagemagick
            convert -size 512x512 xc:#ff99cc -font DejaVu-Sans-Bold -pointsize 200 -fill white -gravity center -annotate 0 "MQ" ai_chat_icon.png
          fi
        continue-on-error: true

      - name: Install system dependencies
        run: |
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 libffi-dev libssl-dev \
            libsqlite3-dev

      - name: Install Cython and Buildozer
        run: |
          python3.10 -m pip install --upgrade pip
          python3.10 -m pip install cython==0.29.33 buildozer==1.5.0

      - name: Cache Buildozer global dir
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        run: |
          # 强制设置环境变量，确保 Buildozer 能找到文件和入口
          export BUILDOZER_SOURCE_INCLUDE_EXTS="py,png,jpg,kv,atlas,txt,json,mp3,wav"
          export BUILDOZER_ENTRYPOINT="main.py"
          yes | python3.10 -m buildozer -v android debug --no-bootstrap

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: muqing-apk
          path: bin/*.apk
